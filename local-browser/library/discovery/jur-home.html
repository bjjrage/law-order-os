  <script>


    $body = $("body");

    jQuery(document).ready(function () {
      Main.init();
    });

    $(document).on({
      ajaxStart: function () {
        $body.block({
          overlayCSS: {
            backgroundColor: '#fff'
          },
          message: '<img src="/jurisprudencia/content/assets/images/loading.gif"/> Espere un momento por favor ...',
          css: {
            border: 'none',
            color: '#333',
            background: 'none'
          }
        });
      },
      ajaxStop: function () {
        window.setTimeout(function () {
          $body.unblock();
        }, 1000);
      },
      ajaxError: function () {
        window.setTimeout(function () {
          $body.unblock();
        }, 1000);
      }
    });

    $(document).on("click", "a", function () {

      var tab = $(this).attr('data-toggle');
      var url = $(this).attr('href');
      var target = $(this).attr('target');
      var vista = $(this).attr('data-indentificador');
      var nivel = $(this).attr('data-nivel');

      if (vista) {

        $.MostrarContenido.opctionsDefault.identificador = vista;
        $.MostrarContenido.opctionsDefault.url = url;

        if (nivel) {
          var actual = $.ObtenerVistaActual();
          $.OcultarVista(actual.vista);
        }

        $.MostrarContenido();

      } else {
        if (!tab) {
          if (url) {
            if (target) {
              window.open(url);
            } else {
              window.location.href = url;
            }
          }
        }
      }
      return false;
    });


  </script>
